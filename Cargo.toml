[workspace]
members = ["crates/vidforge-core", "crates/vidforge-wasm", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl"] }

# WebAssembly 引擎按体积优化（只有 vidforge-wasm 以 cdylib 形式编到 wasm32 时用得上）
[profile.release.package.vidforge-wasm]
opt-level = "s"
